function openImport(){
  importFile.value = "";

}

function normalisasiImport(raw){
  const arr = Array.isArray(raw) ? raw :
              (raw && Array.isArray(raw.data)) ? raw.data :
              (raw && Array.isArray(raw.items)) ? raw.items : null;
  if(!arr) throw new Error("Format JSON harus berupa array data atau object dengan field data/items.");

  return arr.map(x => {
    const plu = String(x.plu ?? x.PLU ?? "").replace(/[^0-9]/g, "");
    if(!plu) return null;
    return {
      plu,
      barcode: String(x.barcode ?? x.BARCODE ?? ""),
      nama: String(x.nama ?? x.NAMA ?? x.name ?? "").trim().toUpperCase(),
      stock: Number.isFinite(Number(x.stock ?? x.STOCK)) ? parseInt(x.stock ?? x.STOCK) : null,
      qty: Number.isFinite(Number(x.qty ?? x.QTY)) ? parseInt(x.qty ?? x.QTY) : 0
    };
  }).filter(Boolean);
}

function importDataFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file){ keepFocus(); return; }

  const reader = new FileReader();
  reader.onload = function(){
    try{
      const raw = JSON.parse(String(reader.result || ""));
      const masuk = normalisasiImport(raw);
      if(masuk.length === 0) throw new Error("Tidak ada PLU valid di file.");

      let baru = 0, update = 0;
      masuk.forEach(x => {
        const i = data.findIndex(d => String(d.plu) === x.plu);
        if(i === -1){
          data.push({
            plu:x.plu,
            barcode:x.barcode,
            nama:x.nama || "ITEM " + x.plu,
            stock:x.stock ?? 0,
            qty:x.qty || 0,
            stockGudang:false,
            stockGudangQty:0
          });
          baru++;
        }else{
          // Import berfungsi sebagai merge master data. Hitungan SO/Gudang yang sedang berjalan tidak dihapus.
          if(x.barcode) data[i].barcode = x.barcode;
          if(x.nama) data[i].nama = x.nama;
          if(x.stock !== null && (parseInt(data[i].stock)||0) === 0) data[i].stock = x.stock;
          update++;
        }
      });

      save();
      render();
      alert("Import berhasil: " + baru + " item baru, " + update + " item diperbarui. QTY SO dan snapshot Stock Gudang yang sudah ada tetap aman.");
    }catch(err){
      alert("Import gagal: " + err.message);
    }finally{
      importFile.value = "";
      keepFocus();
    }
  };
  reader.onerror = function(){
    alert("File tidak dapat dibaca.");
    importFile.value = "";
    keepFocus();
  };
  reader.readAsText(file);
}

function markStockGudang(){
  const kandidat = data.filter(x => (parseInt(x.qty)||0) > 0);
  if(kandidat.length === 0){
    alert("Belum ada QTY yang diinput. Item dengan QTY 0 tidak akan masuk Stock Gudang.");
    return;
  }

  const pesan = "Mark Stock Gudang sekarang?\n\n" +
    kandidat.length + " item dengan QTY > 0 akan disimpan sebagai snapshot Stock Gudang.\n" +
    "Item QTY 0 tidak akan ikut. Jika sebelumnya sudah pernah Mark, snapshot lama akan diperbarui.";
  if(!confirm(pesan)) return;

  data.forEach(x => {
    const q = parseInt(x.qty)||0;
    x.stockGudangQty = q > 0 ? q : 0;
    x.stockGudang = x.stockGudangQty > 0;
  });

  save();
  render();
  keepFocus();
}

  scanModeBtn.classList.toggle("active", !keyboardMode);

  try{ search.focus({preventScroll:true}); }catch(err){ search.focus(); }

}

function render(){
 let key = (search.value || "").toLowerCase();
 let html="";
 const gudangView = filterMode === "gudang";

 if(gudangView){
   mainHeader.classList.add("gudang-view");
   mainHeader.innerHTML = `
     <div>PLU</div>
     <div>NAMA</div>
     <div onclick="toggleFilter()" style="cursor:pointer;">QTY STOCK ▼</div>`;
 }else{
   mainHeader.classList.remove("gudang-view");
   mainHeader.innerHTML = `
     <div></div><div>PLU</div><div>NAMA</div>
     <div id="stockHeader">${showStock ? "STOCK" : "-"}</div>
     <div>QTY</div>
     <div onclick="toggleFilter()" style="cursor:pointer;">SELISIH ▼</div>`;
 }

 data.forEach((x,i)=>{
  let plu = (x.plu||"").toString();
  let barcode = (x.barcode||"").toString();
  let nama = (x.nama||"").toLowerCase();
  let gudangQty = parseInt(x.stockGudangQty)||0;

  let selisih = x.qty - x.stock;
  let lolosFilter = (
    filterMode==="all" ||
    (filterMode==="klop" && selisih===0) ||
    (filterMode==="plus" && selisih>0) ||
    (filterMode==="minus" && selisih<0) ||
    (filterMode==="gudang" && gudangQty>0)
  );

  if(lolosFilter && (
    plu.includes(key) ||
    barcode.includes(key) ||
    nama.includes(key)
  )){
    if(gudangView){
      html+=`
      <div class="item gudang-item" onclick="openGudangModal(${i})">
        <div>${x.plu}</div>
        <div>${x.nama}</div>
        <div style="font-weight:bold;color:#ef6c00;">${gudangQty}</div>
      </div>`;
    }else{
      html+=`
      <div class="item">
        <div onclick="event.stopPropagation();hapus(${i})" style="color:#d50000;font-weight:bold;">❌</div>
        <div onclick="openModal(${i})">${x.plu}</div>
        <div onclick="openModal(${i})">${gudangQty>0 ? "📦 " : ""}${x.nama}</div>
        <div onclick="clickStock(${i})">${showStock ? x.stock : ''}</div>
        <div onclick="openModal(${i})">${x.qty}</div>
        <div style="color:${(x.qty-x.stock)==0?"green":(x.qty-x.stock)<0?"red":"blue"};font-weight:bold;">
          ${(x.qty-x.stock)==0?"KLOP":(x.qty-x.stock)>0?"+"+(x.qty-x.stock):(x.qty-x.stock)}
        </div>
      </div>`;
    }
  }
 });
 list.innerHTML=html;
}

// FIX SCAN + MODE KEYBOARD

function prosesScan(){
  let key = search.value.trim();
  if(!key) return;

  let index = data.findIndex(x =>
    String(x.plu || "") === key ||
    String(x.barcode || "") === key ||
    String(x.nama || "").toLowerCase() === key.toLowerCase()
  );

  search.value = "";
  updateClearButton();
  render();

  if(index !== -1){
    openModal(index);
  }else{
    alert("Data tidak ditemukan");
    keepFocus();
  }
}

// Di mode scan input dibuat readonly agar keyboard layar tidak muncul.
// Karakter dari scanner tetap ditangkap manual di sini.
let waktuTombolScanner = 0;
search.addEventListener("keydown", function(e){
  if(e.ctrlKey || e.altKey || e.metaKey) return;

  if(e.key === "Enter" || e.key === "Tab"){
    e.preventDefault();
    prosesScan();
    return;
  }

  if(searchMode === "scan"){
    if(e.key === "Backspace"){
      e.preventDefault();
      search.value = search.value.slice(0,-1);
      handleSearch();
      return;
    }

    if(e.key.length === 1){
      e.preventDefault();
      let sekarang = Date.now();
      if(sekarang - waktuTombolScanner > 900){
        search.value = "";
      }
      waktuTombolScanner = sekarang;
      search.value += e.key;
      handleSearch();
    }
  }
});


// AUTO FOCUS SEARCH - mode scan selalu standby, mode keyboard tidak mencuri fokus
function modalSedangTerbuka(){
  return modal.style.display === "flex" ||
         stockModal.style.display === "flex" ||
         gudangModal.style.display === "flex" ||
         inputModal.style.display === "flex" ||
         calcModal.style.display === "flex";
}

function focusSearch(force){
  if(modalSedangTerbuka()) return;
  if(searchMode !== "scan" && !force) return;

  let aktif = document.activeElement;
  if(!force && aktif && aktif !== search &&
     (aktif.tagName === "INPUT" ||
      aktif.tagName === "TEXTAREA" ||
      aktif.tagName === "SELECT")) return;

  try{
    search.focus({preventScroll:true});
  }catch(err){
    search.focus();
  }
  try{ search.setSelectionRange(search.value.length, search.value.length); }catch(err){}
}

window.onload = function(){
  setSearchMode("scan");
  updateClearButton();
  requestAnimationFrame(function(){ focusSearch(true); });
  setTimeout(function(){ focusSearch(true); }, 150);
};

window.addEventListener("focus", function(){
  if(searchMode === "scan") setTimeout(focusSearch, 80);
});

document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && searchMode === "scan"){
    setTimeout(focusSearch, 80);
  }
});

// Klik area biasa mengembalikan scanner. Input dan modal tidak diganggu.
document.addEventListener("click", function(e){
  if(searchMode !== "scan") return;
  if(e.target.closest && e.target.closest("input, #selisihFilter")) return;
  setTimeout(function(){
    if(searchMode === "scan" && !modalSedangTerbuka()) focusSearch(true);
  }, 60);
});

// Cadangan saat fokus scanner sempat lepas.
document.addEventListener("keydown", function(e){
  if(searchMode !== "scan" || modalSedangTerbuka()) return;
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  if(e.target === search) return;

  let target = e.target;
  if(target && (target.tagName === "INPUT" ||
                target.tagName === "TEXTAREA" ||
                target.tagName === "SELECT")) return;

  if(e.key === "Enter" || e.key === "Tab"){
    e.preventDefault();
    if(search.value) prosesScan();
    else focusSearch(true);
    return;
  }

  if(e.key.length === 1){
    e.preventDefault();
    let sekarang = Date.now();
    if(sekarang - waktuTombolScanner > 900){
      search.value = "";
    }
    waktuTombolScanner = sekarang;
    search.value += e.key;
    handleSearch();
    focusSearch(true);
  }
}, true);

// keep focus after modal close / simpan
function keepFocus(){
  if(searchMode === "scan") setTimeout(function(){ focusSearch(true); }, 120);
}

// Pengaman Android/PDA: bila fokus scan lepas tanpa modal/input aktif, aktifkan kembali.
setInterval(function(){
  if(searchMode !== "scan" || document.visibilityState !== "visible" || modalSedangTerbuka()) return;
  if(document.activeElement !== search) focusSearch(true);
}, 900);

  if(!btn) return;
  btn.style.top = "50%";
  btn.style.transform = "translateY(-50%)";
  btn.style.bottom = "";
}

// move up when keyboard/input active

  let btn = getCalcBtn();
  if(!btn) return;
  btn.style.top = "";
  btn.style.transform = "";
  btn.style.bottom = "120px";
}

// focus detect
document.addEventListener("focusin", function(e){
  if(e.target.tagName === "INPUT" && !(e.target === search && searchMode === "scan")){
    setUp();
  }
});

document.addEventListener("focusout", function(){
  setTimeout(()=>{ setCenter(); },200);
});

// resize fallback
window.addEventListener("resize", function(){
  let vh = window.innerHeight;
  let full = screen.height;

  if(vh < full - 150){
    setUp();
  } else {

  }
});


function exportPDF(){
  try {

    let shift = prompt("Masukkan Shift (contoh: Shift 1 / Shift 2 / Malam)");
    if(!shift) return;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let y = 12;

    doc.setFontSize(14);
    doc.text("REPORT STOCK OPNAME", 10, y);

    let today = new Date();
    let tgl = today.getFullYear() + "-" +
              String(today.getMonth()+1).padStart(2,'0') + "-" +
              String(today.getDate()).padStart(2,'0');

    doc.setFontSize(10);
    doc.text("Tanggal SO : " + tgl, 10, y + 6);
    doc.text("Shift      : " + shift, 10, y + 12);

    y += 18;

    // header garis rapi (tidak nabrak teks)
    doc.line(10, y-4, 200, y-4);

    doc.text("PLU", 10, y);
    doc.text("NAMA", 40, y);
    doc.text("STOCK", 110, y);
    doc.text("QTY", 140, y);
    doc.text("SELISIH", 170, y);

    doc.line(10, y+4, 200, y+4);

    y += 10;

    data.forEach((x,i) => {

      if(i % 2 === 0){
        doc.setFillColor(245,245,245);
        doc.rect(10, y-5, 190, 8, 'F');
      }

      let selisih = x.qty - x.stock;
      let textSelisih = selisih === 0 ? "KLOP" : (selisih > 0 ? "+"+selisih : selisih);

      doc.setTextColor(0,0,0);
      doc.text(String(x.plu), 10, y);
      doc.text(String(x.nama).substring(0,25), 40, y);
      doc.text(String(x.stock), 110, y);
      doc.text(String(x.qty), 140, y);

      if(selisih === 0){
        doc.setFillColor(200,255,200);
      } else if(selisih > 0){
        doc.setFillColor(200,220,255);
      } else {
        doc.setFillColor(255,200,200);
      }

      doc.rect(168, y-4, 24, 6, 'F');

      let textWidth = doc.getTextWidth(String(textSelisih));
      let centerX = 180 - (textWidth / 2);
      doc.text(String(textSelisih), centerX, y);

      y += 8;

      if(y > 280){
        doc.addPage();
        y = 12;
      }
    });

    let filename = "SO 979 - " + shift + " - " + tgl + ".pdf";
    doc.save(filename);

  } catch(err){
    alert("Error PDF: " + err);
  }
}



// FIX PLUS MINUS QTY (FINAL)
function plusQty(){
  let val = parseInt(m_input.value);
  if(isNaN(val)) val = 0;
  val += 1;

}
